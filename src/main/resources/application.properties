spring.application.name=boleta_app
spring.cache.type= redis
spring.cache.redis.cache-null-values=true
server.port=8087
spring.cache.redis.time-to-live= 60000
spring.data.mongodb.uri=mongodb://${MONGO_DB_USER}:${MONGO_DB_PASSWORD}@localhost:27017/${MONGO_DB_NAME}?authSource=admin
spring.data.mongodb.database=juniorapp
spring.banner.location=banner.txt
springdoc.api-docs.path=/junior-api
springdoc.swagger-ui.path=/junior-api/swagger-ui.html
